version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: voting_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: gunicorn voting_system.wsgi:application --bind 0.0.0.0:8000
    environment:
      DB_NAME: voting_system
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      SECRET_KEY: your-secret-key-here
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
